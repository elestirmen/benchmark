name: visual_navigation_cuda
channels:
  - conda-forge
  - defaults
dependencies:
  # TensorFlow 2.10 is the final release with native-Windows CUDA support.
  - python=3.10
  - numpy=1.23.5
  - opencv=4.10
  - rasterio=1.3.10
  - affine=2.4.0
  - matplotlib
  - natsort
  - tqdm
  - openpyxl=3.1.5
  - h5py=3.10
  - cudatoolkit=11.2
  - cudnn=8.1
  - pip
  - pip:
      - tensorflow==2.10.1
